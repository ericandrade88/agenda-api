spring:
  application:
    name: agenda-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agenda_api}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update      # cria/atualiza as tabelas automaticamente
    open-in-view: false
    show-sql: true

server:
  port: 8080
